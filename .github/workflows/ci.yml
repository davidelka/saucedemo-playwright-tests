name: CI

# "Nightly" below means the scheduled run, or "Run workflow" with the nightly box ticked:
#   github.event_name == 'schedule' || inputs.nightly
# GitHub doesn't let strategy or timeout-minutes read env, so the condition is repeated.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * *" # every day at 03:00 UTC, on the default branch
  workflow_dispatch: # "Run workflow" button, on any branch
    inputs:
      nightly:
        description: "Nightly run: add WebKit and run each test 3 times"
        type: boolean
        default: false

# A newer push to the same branch cancels the run still in progress.
# Nightly runs get their own group, so a push and a nightly run don't cancel each other.
concurrency:
  group: ci-${{ github.ref }}${{ (github.event_name == 'schedule' || inputs.nightly) && '-nightly' || '' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint, types, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0 # setup-uv publishes exact versions only (no v10 tag)
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy framework tests
      # Fast feedback before any browser is installed. The browser jobs run these again
      # (about 2 seconds) so their traceability report covers the whole plan.
      - name: Unit tests (no browser)
        run: uv run pytest -m unit --no-test-plan -q

  test:
    name: Tests (${{ matrix.browser }})
    needs: lint
    runs-on: ubuntu-latest
    # Nightly runs every test three times, so it gets more time.
    timeout-minutes: ${{ (github.event_name == 'schedule' || inputs.nightly) && 30 || 15 }}
    strategy:
      fail-fast: false # one browser failing doesn't cancel the others
      matrix:
        # Push and pull request: Chromium and Firefox. Nightly adds WebKit.
        browser: ${{ fromJSON((github.event_name == 'schedule' || inputs.nightly) && '["chromium", "firefox", "webkit"]' || '["chromium", "firefox"]') }}
    env:
      SAUCE_PASSWORD: ${{ secrets.SAUCE_PASSWORD }} # repository secret: masked as *** in the log
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0 # setup-uv publishes exact versions only (no v10 tag)
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.browser }}-${{ hashFiles('uv.lock') }}
      - name: Install ${{ matrix.browser }} and its system libraries
        run: uv run playwright install --with-deps ${{ matrix.browser }}
      # Tracing and screenshots on failure come from pyproject.toml (addopts).
      # The traceability report is also written to this job's summary page.
      # Nightly adds --count 3 (pytest-repeat): each test runs three times, to find flaky tests.
      - name: Run tests
        run: >-
          uv run pytest -n auto --browser ${{ matrix.browser }}
          --reruns 1
          ${{ (github.event_name == 'schedule' || inputs.nightly) && '--count 3' || '' }}
          --html reports/report-${{ matrix.browser }}.html --self-contained-html
      - name: Upload HTML report and traceability report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: report-${{ matrix.browser }}
          path: reports/
          retention-days: 14
      # Uploaded whenever tests ran, not only when the job fails: a test that fails and then
      # passes on its rerun leaves the job green, and its first attempt's trace is what
      # explains the flake.
      - name: Upload traces and screenshots of failed attempts (including flaky tests)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: traces-${{ matrix.browser }}
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore
