[project]
name = "saucedemo-playwright"
version = "0.1.0"
description = "Playwright + pytest test framework for saucedemo.com"
requires-python = ">=3.12"
dependencies = [
    "playwright==1.65.2",
    "pydantic-settings>=2.16.3",
    "pytest>=9.2.0",
    "pytest-html>=4.2.0",
    "pytest-playwright>=0.10.0",
    "pytest-repeat>=0.9.4",
    "pytest-rerunfailures>=16.7",
    "pytest-xdist>=3.8.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# Same defaults locally and in CI: on failure keep a Playwright trace and a screenshot
# (in test-results/, and linked/embedded in the HTML report when --html is given).
addopts = "--strict-markers --tracing=retain-on-failure --screenshot=only-on-failure --output=test-results"
# An expected failure that starts passing fails the run, so a fixed bug is never missed.
xfail_strict = true
markers = [
    # Suite: how often it runs
    "smoke: fast critical-path checks, run on every PR",
    "regression: full functional coverage",
    # Layer (added automatically from the folder, see framework/tagging.py)
    "unit: framework unit tests, no browser",
    "ui: browser tests against the site",
    # Feature
    "login: login and session",
    "inventory: product list and sorting",
    "cart: cart badge and contents",
    "checkout: checkout flow, totals and validation",
    "menu: side menu (logout, About, Reset App State)",
    "performance: response-time budgets",
    # Flow
    "happy: positive flow, valid input",
    "negative: invalid input or a blocked action",
    # Known bugs
    "bug: known-bug test: a standard_user control that must pass, or an expected failure linked to BUGS.md",
    # User (added automatically from the user a test runs as)
    "user_standard: runs as standard_user",
    "user_locked_out: runs as locked_out_user",
    "user_problem: runs as problem_user",
    "user_performance_glitch: runs as performance_glitch_user",
    "user_error: runs as error_user",
    "user_visual: runs as visual_user",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "PT"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
