[project]
name = "saucedemo-playwright"
version = "0.1.0"
description = "Playwright + pytest test framework for saucedemo.com"
requires-python = ">=3.12"
dependencies = [
    "playwright==1.65.2",
    "pydantic-settings>=2.16.3",
    "pytest>=9.2.0",
    "pytest-html>=4.2.0",
    "pytest-playwright>=0.10.0",
    "pytest-repeat>=0.9.4",
    "pytest-rerunfailures>=16.7",
    "pytest-xdist>=3.8.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "smoke: fast critical-path checks, run on every PR",
    "regression: full functional coverage",
    "bug: exposes a known bug (expected failure, see BUGS.md)",
    "unit: framework unit tests, no browser",
    "visual: screenshot comparison tests (run in Docker)",
    "tc(id): test-case ID from TEST_PLAN.md",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "PT"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
